name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  preflight:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
      - name: Match tag, package versions, and release notes
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Release workflow must run from a version tag." >&2
            exit 1
          fi
          version="$(node -p "require('./apps/desktop/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          build_version="$(node -p "require('./apps/desktop/package.json').build.buildVersion")"
          if [ "$GITHUB_REF_NAME" != "v$version" ] || [ "$root_version" != "$version" ] || [ "$build_version" != "$version" ]; then
            echo "Release tag, workspace version, and packaged version must match." >&2
            exit 1
          fi
          if [ ! -s "docs/release/$version.md" ]; then
            echo "Missing release notes: docs/release/$version.md" >&2
            exit 1
          fi
      - name: Check protected release environment and tag rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-environment.mjs

  build-macos:
    needs: [verify, preflight]
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prepare temporary Apple signing keychain
        working-directory: apps/desktop
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: node scripts/build-release.mjs prepare
      - name: Build, sign, notarize, and verify macOS artifacts
        working-directory: apps/desktop
        run: node scripts/build-release.mjs build --arch ${{ matrix.arch }}
      - name: Upload signed macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-mac-${{ matrix.arch }}
          if-no-files-found: error
          path: apps/desktop/release-verified/*
      - name: Remove temporary Apple signing keychain
        if: always()
        working-directory: apps/desktop
        run: node scripts/build-release.mjs cleanup

  build-other:
    needs: [verify, preflight]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build desktop
        run: pnpm build:desktop
      - name: Package installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify packaged SQLite and version
        working-directory: apps/desktop
        run: node scripts/verify-packaged.mjs
      - name: Upload unsigned manual-update installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-other]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install release verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @copper/desktop...
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: release-artifacts/downloaded
          merge-multiple: false
      - name: Verify macOS metadata and every release asset
        run: |
          node scripts/release-artifacts.mjs collect release-artifacts/downloaded release-artifacts/final
          node scripts/release-artifacts.mjs verify release-artifacts/final
      - name: Create complete draft with versioned notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          gh release create "$GITHUB_REF_NAME" release-artifacts/final/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Copper $version" \
            --notes-file "docs/release/$version.md"
